/////////////////////////////////////////////////
// CS2 PRACTICE CFG
/////////////////////////////////////////////////

echo "=== PRACTICE CONFIG LOADED ==="

// Cheats
sv_cheats 1

// Reiniciar partida
bot_kick
mp_autoteambalance 0
mp_limitteams 0
bot_quota 0
bot_quota_mode fill
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1
mp_restartgame 1
mp_warmup_end

// Tiempo
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_freezetime 0
mp_buytime 9999
mp_buy_anywhere 1
mp_ignore_round_win_conditions 1

// Dinero
mp_startmoney 99999
mp_maxmoney 99999

// Munición
sv_infinite_ammo 1

// Granadas
ammo_grenade_limit_total 5

// Cámara y trayectoria
sv_grenade_trajectory_prac_pipreview 1
sv_grenade_trajectory_prac_trailtime 15

// Impactos de balas
sv_showimpacts 1
sv_showimpacts_time 5

// Bunny Hop
sv_autobunnyhopping 1
sv_enablebunnyhopping 1
sv_airaccelerate 10000
sv_staminajumpcost 0
sv_staminalandcost 0
sv_staminarecoveryrate 0

// Movimiento
sv_accelerate_use_weapon_speed 0

// No morir por caída
sv_falldamage_scale 0

// Regeneración
sv_regeneration_force_on 1

// Intro
cl_versus_intro false
mp_team_intro_time 0

// Binds
bind "F1" "sv_rethrow_last_grenade"
bind "F2" "noclip"
bind "F3" "mp_restartgame 1"

// Elimina humos y molotovs
bind "MOUSE3" "ent_fire smokegrenade_projectile kill;ent_fire molotov_projectile kill;ent_fire incgrenade_projectile kill;stopsound"

// Colocar bot donde apuntas
bind "F5" "bot_add_ct;bot_place;bot_stop 1;bot_zombie 1"
bind "F6" "bot_place"
mp_limitteams 0
mp_autoteambalance 0

// Bot imita tus movimientos
bind "F4" "toggle bot_mimic 0 1"

// Limpiar bot
bind "F11" "bot_kick"

// Ver esqueletos (práctica de prefire)
bind "F8" "ent_skeleton"

// Mostrar/ocultar impactos
bind "F9" "toggle sv_showimpacts 0 1"

echo ""
echo ""
echo ""
